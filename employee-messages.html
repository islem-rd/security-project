<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRBank - Employee Messages</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-turquoise: #00d9ff;
            --secondary-turquoise: #00ffcc;
            --dark-turquoise: #008b9e;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #a0d8e8;
            --glow-primary: rgba(0, 217, 255, 0.4);
            --glow-secondary: rgba(0, 255, 204, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-turquoise) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            opacity: 0.1;
            animation: float 18s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.15); }
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 25px 20px;
            border-right: 1px solid rgba(0, 217, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: var(--glow-turquoise);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: var(--glow-turquoise); }
            50% { box-shadow: var(--glow-secondary); }
        }

        .mode-indicator {
            margin-bottom: 30px;
            font-size: 13px;
            padding: 10px 14px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .mode-indicator .value {
            color: #ff3b30;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: rgba(0, 217, 255, 0.3);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: var(--glow-turquoise);
            transform: translateX(5px);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
        }

        .logout-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary-turquoise), var(--secondary-turquoise));
            color: var(--bg-dark);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 20px var(--glow-primary);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--glow-primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 35px;
            background: transparent;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-turquoise), var(--secondary-turquoise));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-turquoise), var(--secondary-turquoise));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark);
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--glow-primary);
        }
        
        .profile-icon:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 6px 30px var(--glow-secondary);
        }

        /* Messages Layout */
        .messages-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /* Users List */
        .users-list {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-turquoise);
            text-shadow: 0 0 20px var(--glow-primary);
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .user-item:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: rgba(0, 217, 255, 0.3);
            transform: translateX(5px);
        }

        .user-item.active {
            background: rgba(0, 217, 255, 0.15);
            border-color: var(--primary-turquoise);
            box-shadow: 0 4px 20px var(--glow-primary);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #e8e8e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Message Compose */
        .message-compose {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .compose-field {
            margin-bottom: 18px;
        }

        .compose-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .compose-input, .compose-textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            color: var(--text-primary);
            background: rgba(10, 10, 15, 0.6);
        }
        
        .compose-input::placeholder,
        .compose-textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .compose-input:focus, .compose-textarea:focus {
            outline: none;
            border-color: var(--primary-turquoise);
            box-shadow: 0 0 20px var(--glow-primary);
            background: rgba(0, 217, 255, 0.05);
        }

        .compose-textarea {
            resize: vertical;
            min-height: 180px;
        }

        .send-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-turquoise), var(--secondary-turquoise));
            color: var(--bg-dark);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .send-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--glow-primary);
        }
        
        .send-btn:hover::before {
            left: 100%;
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .selected-user {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 217, 255, 0.2);
            font-style: italic;
        }

        @media (max-width: 1000px) {
            .messages-wrapper {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                        <rect x="2" y="5" width="20" height="14" rx="2"/>
                        <line x1="2" y1="10" x2="22" y2="10"/>
                        <circle cx="6" cy="15" r="1" fill="currentColor"/>
                        <line x1="10" y1="15" x2="14" y2="15"/>
                    </svg>
                </div>
                <span>IRbank</span>
            </div>

            <div class="mode-indicator">
                Mode: <span class="value" id="employeeRole">employee</span>
            </div>

            <ul class="nav-menu">
                <li class="nav-item" onclick="goToPage('employee.html')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                    </div>
                    <span>Overview</span>
                </li>
                <li class="nav-item active">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                            <line x1="2" y1="18" x2="9" y2="13"/>
                            <line x1="22" y1="18" x2="15" y2="13"/>
                        </svg>
                    </div>
                    <span>Messages</span>
                </li>
                <li class="nav-item" onclick="goToPage('employee-account.html')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="5"/>
                            <path d="M3 21c0-4.4 4-8 9-8s9 3.6 9 8"/>
                            <circle cx="12" cy="8" r="2" fill="currentColor"/>
                            <path d="M12 10c-1.1 0-2-.9-2-2"/>
                        </svg>
                    </div>
                    <span>Account</span>
                </li>
                <li class="nav-item" id="dbProjectionNav" data-page="employee-iam.html" style="display: none;">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="9" ry="3"/>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                        </svg>
                    </div>
                    <span>IAM & RBAC</span>
                </li>
                
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1 class="header-title">Send Messages</h1>
                <div class="header-right">
                    <button class="logout-btn" onclick="logout()">Logout</button>
                    <div class="profile-icon">👤</div>
                </div>
            </div>

            <div class="messages-wrapper">
                <!-- Users List -->
                <div class="users-list">
                    <h3 class="section-title">Select User</h3>
                    <div id="users-list-container">
                        <div style="padding: 20px; text-align: center; color: #666;">
                            Loading users...
                        </div>
                    </div>
                </div>

                <!-- Message Compose -->
                <div class="message-compose">
                    <h3 class="section-title">Compose Message</h3>
                    
                    <div class="compose-field">
                        <label class="compose-label">Recipient</label>
                        <input type="text" class="compose-input" id="recipientField" placeholder="Select a user from the list" readonly>
                    </div>

                    <div class="compose-field">
                        <label class="compose-label">Subject</label>
                        <input type="text" id="message-subject" class="compose-input" placeholder="Message subject">
                    </div>

                    <div class="compose-field">
                        <label class="compose-label">Message</label>
                        <textarea id="message-content" class="compose-textarea" placeholder="Type your message here..."></textarea>
                    </div>

                    <button class="send-btn" onclick="sendMessage()">Send Message</button>
                    <div class="selected-user" id="selectedInfo" style="display: none;">Message will be sent to the selected user</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let selectedUserId = null;
        let selectedUserName = null;
        let allUsers = [];

        // Check authentication and load data on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await checkEmployeeAuth();
            await loadUsers();
        });

        async function checkEmployeeAuth() {
            try {
                const userType = sessionStorage.getItem('userType');
                const employeeData = sessionStorage.getItem('employeeData');
                
                if (!employeeData || userType !== 'employee') {
                    if (userType === 'user') {
                        alert('You are logged in as a user. Redirecting to user dashboard...');
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('Please login as an employee first');
                        window.location.href = 'index.html';
                    }
                    return;
                }
            } catch (error) {
                console.error('Error checking employee auth:', error);
                window.location.href = 'index.html';
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/api/users?t=${Date.now()}`);
                if (!response.ok) {
                    throw new Error('Failed to load users');
                }
                
                const users = await response.json();
                allUsers = users;
                displayUsersList(users);
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-list-container').innerHTML = 
                    '<div style="padding: 20px; text-align: center; color: #ef4444;">Error loading users</div>';
            }
        }

        function displayUsersList(users) {
            const container = document.getElementById('users-list-container');
            container.innerHTML = '';
            
            if (users.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No users found</div>';
                return;
            }
            
            users.forEach(async (user, index) => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                if (index === 0) {
                    userItem.classList.add('active');
                    selectedUserId = user.id;
                    selectedUserName = user.full_name || user.username;
                    document.getElementById('recipientField').value = selectedUserName;
                }
                
                const userName = user.full_name || user.username || 'User';
                
                // Set placeholder first
                userItem.innerHTML = `
                    <div class="user-avatar">👤</div>
                    <div class="user-name">${userName}</div>
                `;
                
                userItem.onclick = () => selectUser(userItem, user.id, userName);
                container.appendChild(userItem);
                
                // Load avatar asynchronously
                try {
                    const avatarUrl = await getUserAvatarUrl(userName, user.email || user.id, user.id);
                    const avatarDiv = userItem.querySelector('.user-avatar');
                    if (avatarDiv) {
                        avatarDiv.innerHTML = `<img src="${avatarUrl}" alt="${userName}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;" onerror="this.parentElement.innerHTML='👤';">`;
                    }
                } catch (error) {
                    console.error('Error loading avatar:', error);
                }
            });
        }

        // Generate avatar URL for user
        async function getUserAvatarUrl(name, seed, userId = null) {
            if (userId) {
                try {
                    const userResponse = await fetch(`${API_URL}/api/users/${userId}`);
                    if (userResponse.ok) {
                        const user = await userResponse.json();
                        if (user.avatar_url) {
                            return user.avatar_url;
                        }
                    }
                } catch (error) {
                    console.error('Error fetching user avatar:', error);
                }
            }
            
            try {
                const response = await fetch(`${API_URL}/api/avatar/generate?name=${encodeURIComponent(name || 'User')}&seed=${encodeURIComponent(seed || name || 'default')}`);
                if (response.ok) {
                    const data = await response.json();
                    return data.avatar_url;
                }
            } catch (error) {
                console.error('Error generating avatar:', error);
            }
            
            const encodedName = encodeURIComponent(name || 'User');
            return `https://ui-avatars.com/api/?name=${encodedName}&size=128&background=random&color=fff&bold=true&format=png`;
        }

        function selectUser(element, userId, userName) {
            document.querySelectorAll('.user-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            selectedUserId = userId;
            selectedUserName = userName;
            document.getElementById('recipientField').value = userName;
            document.getElementById('selectedInfo').style.display = 'block';
        }

        async function sendMessage() {
            const subject = document.getElementById('message-subject').value;
            const message = document.getElementById('message-content').value;
            
            if (!selectedUserId) {
                alert('Please select a user first');
                return;
            }
            
            if (!subject.trim() || !message.trim()) {
                alert('Please fill in both subject and message fields');
                return;
            }

            try {
                const employeeData = sessionStorage.getItem('employeeData');
                if (!employeeData) {
                    alert('Employee session expired. Please login again.');
                    window.location.href = 'index.html';
                    return;
                }
                
                const employee = JSON.parse(employeeData);
                
                const response = await fetch(`${API_URL}/api/messages/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender_id: employee.id,
                        recipient_id: selectedUserId,
                        subject: subject,
                        content: message
                    })
                });
                
                if (response.ok) {
                    const messageData = await response.json();
                    alert(`Message sent successfully to ${selectedUserName}!`);
                    document.getElementById('message-subject').value = '';
                    document.getElementById('message-content').value = '';
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Failed to send message');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Error sending message. Make sure the backend is running.');
            }
        }

        function goToPage(page) {
            window.location.href = page;
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // Check if employee is admin and update UI
        (function checkAdminRole() {
            const employeeData = sessionStorage.getItem('employeeData');
            if (employeeData) {
                try {
                    const employee = JSON.parse(employeeData);
                    if (employee.role === 'admin') {
                        document.getElementById('employeeRole').textContent = 'admin';
                        const dbProjectionNav = document.getElementById('dbProjectionNav');
                        if (dbProjectionNav) {
                            dbProjectionNav.style.display = 'flex';
                        }
                    }
                } catch (e) {
                    console.error('Error parsing employee data:', e);
                }
            }
        })();
    </script>
</body>
</html>
