<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-turquoise: #00d9ff;
            --secondary-turquoise: #00ffcc;
            --dark-turquoise: #008b9e;
            --bg-dark: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #a0d8e8;
            --glow-primary: rgba(0, 217, 255, 0.4);
            --glow-secondary: rgba(0, 255, 204, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-turquoise) 0%, transparent 70%);
            top: -200px;
            left: -200px;
            opacity: 0.15;
            animation: float 15s ease-in-out infinite;
        }
        
        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary-turquoise) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            opacity: 0.1;
            animation: float 20s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }
        
        .container {
            width: 420px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(0, 217, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(0, 217, 255, 0.15);
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-turquoise), transparent);
            border-radius: 24px 24px 0 0;
        }
        
        h2 {
            margin-bottom: 16px;
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-turquoise), var(--secondary-turquoise));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        
        input {
            width: 100%;
            padding: 16px;
            font-size: 28px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid rgba(0, 217, 255, 0.2);
            letter-spacing: 12px;
            outline: none;
            background: rgba(10, 10, 15, 0.6);
            color: var(--primary-turquoise);
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        input::placeholder {
            color: rgba(160, 216, 232, 0.3);
        }
        
        input:focus {
            border-color: var(--primary-turquoise);
            box-shadow: 0 0 0 4px var(--glow-primary),
                        0 0 30px var(--glow-primary);
            background: rgba(0, 217, 255, 0.05);
        }
        
        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            margin-top: 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary-turquoise) 0%, var(--secondary-turquoise) 100%);
            color: var(--bg-dark);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--glow-primary);
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: rgba(100, 100, 120, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .timer {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 10px;
            background: rgba(0, 217, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 217, 255, 0.1);
        }
        
        .error {
            color: #ff6b6b;
            margin-top: 16px;
            font-size: 14px;
            min-height: 18px;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        .link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--primary-turquoise);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }
        
        .link:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--primary-turquoise);
            box-shadow: 0 0 20px var(--glow-primary);
        }
        
        .debug-info {
            display: none;
            font-size: 13px;
            color: var(--secondary-turquoise);
            background: rgba(0, 255, 204, 0.1);
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }
        
        .debug-info strong {
            color: var(--text-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Verification Code</h2>
        <p id="description">We sent a 6-digit code to your email.</p>
        <div id="debug-info" class="debug-info">
            Test mode: use code <strong id="debug-code"></strong>
        </div>
        <input id="mfaCode" type="text" maxlength="6" placeholder="------" />
        <button id="verify-btn" onclick="verifyCode()">Verify</button>
        <div class="timer" id="timer"></div>
        <div class="error" id="error"></div>
        <div class="link" onclick="returnToLogin()">Back to login</div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const pendingData = JSON.parse(localStorage.getItem('pendingLogin') || 'null');
        const errorEl = document.getElementById('error');
        const timerEl = document.getElementById('timer');
        let expirationTime = Date.now() + 3 * 60 * 1000;

        if (!pendingData || !pendingData.role || !pendingData.id) {
            errorEl.textContent = 'No pending login found. Please sign in again.';
            document.getElementById('verify-btn').disabled = true;
        } else {
            if (pendingData.debugCode) {
                const debugInfo = document.getElementById('debug-info');
                document.getElementById('debug-code').textContent = pendingData.debugCode;
                debugInfo.style.display = 'block';
            }
            startTimer();
        }

        function startTimer() {
            const interval = setInterval(() => {
                const remaining = expirationTime - Date.now();

                if (remaining <= 0) {
                    clearInterval(interval);
                    timerEl.textContent = 'Code expired. Please log in again.';
                    document.getElementById('verify-btn').disabled = true;
                    return;
                }

                const seconds = Math.floor(remaining / 1000);
                timerEl.textContent = `Code expires in ${seconds}s`;
            }, 1000);
        }

        async function verifyCode() {
            if (!pendingData || !pendingData.role) {
                errorEl.textContent = 'Session expired. Please login again.';
                return;
            }

            const code = document.getElementById('mfaCode').value.trim();
            if (code.length !== 6) {
                errorEl.textContent = 'Please enter a valid 6-digit code.';
                return;
            }

            // Disable button while verifying
            const btn = document.getElementById('verify-btn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            errorEl.textContent = '';

            try {
                const isEmployee = pendingData.role === 'employee';
                const endpoint = isEmployee ? '/api/employees/verify-code' : '/api/users/verify-code';
                const payload = isEmployee
                    ? { employee_id: Number(pendingData.id), code }
                    : { user_id: Number(pendingData.id), code };

                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.detail || 'Invalid code. Please try again.';
                    btn.disabled = false;
                    btn.textContent = 'Verify';
                    return;
                }

                // Successful verification - redirect based on user type
                if (isEmployee) {
                    sessionStorage.setItem('userType', 'employee');
                    sessionStorage.setItem('employeeId', data.id);
                    sessionStorage.setItem('employeeData', JSON.stringify(data));
                    window.location.href = 'employee.html';
                } else {
                    sessionStorage.setItem('userType', 'user');
                    sessionStorage.setItem('userId', data.id);
                    sessionStorage.setItem('userData', JSON.stringify(data));
                    window.location.href = 'dashboard.html';
                }

                localStorage.removeItem('pendingLogin');
            } catch (err) {
                console.error('Verification error:', err);
                errorEl.textContent = 'Connection error. Please check your internet and try again.';
                btn.disabled = false;
                btn.textContent = 'Verify';
            }
        }

        function returnToLogin() {
            localStorage.removeItem('pendingLogin');
            window.location.href = 'index.html';
        }

        // Allow Enter key to submit
        document.getElementById('mfaCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyCode();
            }
        });
    </script>
</body>
</html>
